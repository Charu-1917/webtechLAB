<!DOCTYPE html>
<!-- Experiment 02: Working with HTML5 Form and Media Elements -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile - HTML5 Lab</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #ffffff;
            color: #333;
        }

        /* Header Section */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .header img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border: 1px solid #ccc;
        }
        .header h1 {
            font-size: 26px;
            margin: 0;
            font-family: "Times New Roman", serif;
        }

        /* Navigation Links and Search Bar */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #aaa;
            border-bottom: 1px solid #aaa;
            padding: 8px 0;
            margin-bottom: 20px;
        }
        .nav-bar a {
            text-decoration: underline;
            color: #604080;
            margin-right: 25px;
            font-weight: 500;
        }
        .nav-bar input[type="search"] {
            padding: 3px 6px;
        }

        /* Skills Progress and Video Section */
        .content-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            align-items: flex-start;
        }
        .skills-section {
            width: 35%;
        }
        .skills-section label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-top: 10px;
        }
        .skills-section progress {
            width: 100%;
            height: 16px;
        }
        .video-section {
            width: 65%;
            text-align: center;
        }
        .video-section video {
            width: 100%;
            max-height: 250px;
            background-color: #000;
            border: 1px solid #ccc;
        }

        /* Form Tables and Fieldsets */
        .forms-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        fieldset {
            flex: 1;
            border: 1px solid #888;
            padding: 10px 15px;
        }
        legend {
            font-weight: bold;
            padding: 0 4px;
        }
        .form-line {
            margin-bottom: 8px;
            font-size: 13px;
        }
        .form-line label {
            display: inline-block;
            width: 130px;
        }
        .form-line input, .form-line select, .form-line textarea {
            font-size: 13px;
        }

        /* Embed and Map Section */
        .frames-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .frames-row iframe {
            flex: 1;
            height: 220px;
            border: 1px solid #888;
        }

        /* Audio Player Element */
        .audio-section {
            margin-bottom: 20px;
        }
        .audio-section audio {
            width: 100%;
        }

        /* Footer Section */
        footer {
            border-top: 1px solid #aaa;
            padding-top: 10px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <!-- Header: Photo and Name -->
    <div class="header">
        <img src="profile pic .jpeg" alt="Profile Picture">
        <h1>Ms.Mariah Caraiban</h1> 
    </div>

    <!-- Navigation Bar -->
    <div class="nav-bar">
        <div>
            <a href="#academics">Academics</a>
            <a href="#achievements">Achievements</a>
            <a href="#friends">Friends</a>
        </div>
        <div>
            <input type="search" placeholder="search...">
        </div>
    </div>

    <!-- Skills (Progress Bars) and Native HTML5 Video Section -->
    <div class="content-row">
        <div class="skills-section">
            <label for="ps">Photoshop:</label>
            <progress id="ps" value="50" max="100"></progress>

            <label for="java">Java:</label>
            <progress id="java" value="75" max="100"></progress>

            <label for="cpp">C++:</label>
            <progress id="cpp" value="60" max="100"></progress>

            <label for="php">PHP:</label>
            <progress id="php" value="40" max="100"></progress>

            <label for="js">Javascript:</label>
            <progress id="js" value="50" max="100"></progress>
        </div>

        <!-- Replaced YouTube iframe with standard HTML5 <video> matching assignment -->
        <div class="video-section">
            <video controls poster="https://via.placeholder.com/400x220?text=Video+Thumbnail">
                <source src="sample-video.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
    </div>

    <!-- Forms Section -->
    <form action="/action_page.php" method="get">
        <div class="forms-row">
            
            <!-- Personal Information -->
            <fieldset>
                <legend>Personal Information</legend>

                <div class="form-line">
                    <label for="uname">User name:</label>
                    <input type="text" id="uname" name="uname" placeholder="Enter the user name">
                </div>

                <div class="form-line">
                    <label for="pwd">Password:</label>
                    <input type="password" id="pwd" name="pwd" placeholder="Mustlength>10">
                </div>

                <div class="form-line">
                    <label for="regno">Reg. No:</label>
                    <input type="text" id="regno" name="regno" value="URK24CS1162">
                </div>

                <div class="form-line">
                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age" min="18" max="24" placeholder="19-24">
                </div>

                <div class="form-line">
                    <label>Gender:</label>
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male" style="width: auto;">Male</label>
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female" style="width: auto;">Female</label>
                </div>

                <div class="form-line">
                    <label for="dob">DOB:</label>
                    <input type="date" id="dob" name="dob">
                </div>

                <div class="form-line">
                    <label for="color">Favorite Color:</label>
                    <input type="color" id="color" name="color">
                </div>

                <div class="form-line">
                    <label for="photo">Change Profile Photo:</label>
                    <input type="file" id="photo" name="photo">
                </div>
            </fieldset>

            <!-- Contact Information -->
            <fieldset>
                <legend>Contact Information</legend>

                <div class="form-line">
                    <label for="addr">Address:</label><br>
                    <textarea id="addr" name="addr" rows="3" style="width: 95%;">Karunya University, Karunya Nagar, Coimbatore, Tamil Nadu - 641114</textarea>
                </div>

                <div class="form-line">
                    <label for="state">State:</label>
                    <select id="state" name="state">
                        <option value="">Select</option>
                        <option value="tn" selected>Tamil Nadu</option>
                        <option value="kl">Kerala</option>
                        <option value="ka">Karnataka</option>
                    </select>
                </div>

                <div class="form-line">
                    <label for="zip">Zipcode:</label>
                    <input type="text" id="zip" name="zip" placeholder="641114">
                </div>

                <div class="form-line">
                    <label for="mobile">Mobile:</label>
                    <input type="tel" id="mobile" name="mobile" placeholder="(+91)99999-99999">
                </div>

                <div class="form-line">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="urk24cs1162@karunya.edu.in">
                </div>

                <div class="form-line">
                    <label for="url">URL:</label>
                    <input type="url" id="url" name="url" placeholder="https://karunya.edu">
                </div>

                <div class="form-line">
                    <input type="checkbox" id="verify" name="verify">
                    <label for="verify" style="width: auto;">I verified</label>
                </div>

                <div class="form-line">
                    <input type="submit" value="Submit">
                </div>
            </fieldset>

        </div>
    </form>

    <!-- Embedded Documents and Maps Section -->
    <div class="frames-row">
        <!-- PDF / HTML File Viewer -->
        <iframe src="sample.pdf" title="Embedded Document"></iframe>

        <!-- Map View for Karunya University -->
        <iframe 
            src="https://maps.google.com/maps?q=Karunya+University&t=&z=13&ie=UTF8&iwloc=&output=embed" 
            title="University Location">
        </iframe>
    </div>

    <!-- Audio Element -->
    <div class="audio-section">
        <audio controls>
            <source src="SEU_Worship_-_What_A_God_CeeNaija.com_.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>

    <!-- Footer Section -->
    <footer>
        <p><strong>Karunya University, Karunya Nagar, Coimbatore, Tamil Nadu</strong></p>
        <p>&copy; 2024-2028. (URK24CS1162) - Web Technology Lab Batch 3. All Rights Reserved.</p>
    </footer>

</body>
</html>
