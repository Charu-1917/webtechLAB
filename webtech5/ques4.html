<!DOCTYPE html>
<html>
<head>
    <title>Currency Converter</title>
</head>
<body>
    <fieldset> 
        Convert <input type="text" id="data" />
        <select id="from">
            <option value="INR">Indian Rupee</option>
            <option value="USD">US Dollar</option>
        </select>
        to
        <select id="to">
            <option value="USD">US Dollar</option>
            <option value="INR">Indian Rupee</option>
        </select>
        <button onclick="convert();">Calculate</button>
        <span id="answer"></span>
    </fieldset>

    <script>
        function convert() {
            var amount = parseFloat(document.getElementById("data").value);
            var fromCurrency = document.getElementById("from").value;
            var toCurrency = document.getElementById("to").value;
            var result = 0;

            if (fromCurrency === "INR" && toCurrency === "USD") {
                result = amount * 0.015;
            } else if (fromCurrency === "USD" && toCurrency === "INR") {
                result = amount * 67.12;
            } else {
                result = amount; // If same currency is selected
            }

            document.getElementById("answer").innerHTML = result.toFixed(2) + " " + toCurrency;
        }
    </script>
</body>
</html>
