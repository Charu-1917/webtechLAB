<!DOCTYPE html>
<html>
<head>
    <title>Fruit Farm</title>
</head>
<body>
    <h1>Fruit Farm</h1>
    <div>
        Rows: <input type="text" id="rows" />
        Columns: <input type="text" id="columns" /> <br />
        <button onclick="grow();">Plant Garden</button>
    </div>
    <div id="garden"></div>

    <script>
        function grow() {
            var rows = parseInt(document.getElementById("rows").value);
            var cols = parseInt(document.getElementById("columns").value);
            var garden = document.getElementById("garden");
            garden.innerHTML = ""; // Clear previous grid

            var arr = ["Orange.jpg", "Apple.jpg"];

            for (var i = 0; i < rows; i++) {
                for (var j = 0; j < cols; j++) {
                    var randomIndex = Math.floor(Math.random() * 2);
                    garden.innerHTML += "<img src='" + arr[randomIndex] + "' width='100px' height='100px'>";
                }
                garden.innerHTML += "<br/>";
            }
        }
    </script>
</body>
</html>
