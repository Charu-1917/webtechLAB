<!DOCTYPE html>
<html>
<head>
    <title>Cake Order Form</title>
</head>
<body>
    <h1>Cake Order Form</h1>

    <fieldset>
        # of 1/2kg Cakes <input type="text" id="small" value="0" /><br />
        # of 1kg Cakes <input type="text" id="medium" value="0" /><br />
        # of 2kg Cakes <input type="text" id="large" value="0" /><br />

        Tip:
        <label><input type="radio" value="10" name="tip" /> 10%</label>
        <label><input type="radio" value="15" name="tip" checked="checked" /> 15%</label>
        <label><input type="radio" value="20" name="tip" /> 20%</label> <br />

        <button id="submit">Calculate Order</button>
    </fieldset>

    <p>
        Cost of order: Rs. <span id="price"></span>
    </p>

    <script>
        document.getElementById("submit").addEventListener("click", calculateOrder);

        function calculateOrder() {
            var small = parseInt(document.getElementById("small").value) || 0;
            var medium = parseInt(document.getElementById("medium").value) || 0;
            var large = parseInt(document.getElementById("large").value) || 0;

            // Cake prices: 1/2kg = 100, 1kg = 200, 2kg = 400
            var subtotal = (small * 100) + (medium * 200) + (large * 400);

            // 9% Tax
            var totalWithTax = subtotal + (subtotal * 0.09);

            // Tip percentage from selected radio button
            var tipPercent = parseFloat(document.querySelector('input[name="tip"]:checked').value);
            var tipAmount = totalWithTax * (tipPercent / 100);

            var finalPrice = totalWithTax + tipAmount;

            document.getElementById("price").innerHTML = finalPrice.toFixed(2);
        }
    </script>
</body>
</html>
