<!DOCTYPE html>
<html>
<head>
    <title>Car Animation</title>
</head>
<body>
    <h1>Car Animation</h1>
    <button onclick="moveRight()">Move</button>
    <button onclick="stop()">Stop</button>
    <br/><br/>

    <!-- Sample placeholder car image -->
    <img id="img" src="Car.png" style="position: relative; left: 0px;" />

    <script>
        var animate;
        var imgObj = null;

        function init() {
            imgObj = document.getElementById('img');
            imgObj.style.position = 'relative'; 
            imgObj.style.left = '0px';
        }

        function moveRight() {
            imgObj.style.left = parseInt(imgObj.style.left) + 2 + 'px';
            animate = setTimeout(moveRight, 10); // calls moveRight every 10ms
        }

        function stop() {
            clearTimeout(animate);
        }

        window.onload = init;
    </script>
</body>
</html>
