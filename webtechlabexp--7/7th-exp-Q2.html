<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cake Shop</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; text-align: center; }
    .header { background-color: #cc0000; color: white; padding: 12px; font-size: 20px; font-weight: bold; }
    .gallery { display: flex; justify-content: center; gap: 20px; margin: 20px 0; }
    .cake-item { width: 160px; text-align: center; font-size: 14px; font-weight: bold; }
    .cake-item img { width: 100%; height: 120px; object-fit: cover; border-radius: 4px; }
    .section-title { color: #0033aa; font-size: 22px; font-weight: bold; margin: 15px 0; }
    .form-container { width: 450px; margin: 0 auto; text-align: left; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; color: #0033aa; font-weight: bold; font-size: 14px; margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 6px; box-sizing: border-box; }
    .btn-place { background-color: #0073e6; color: white; border: none; padding: 8px 30px; border-radius: 4px; cursor: pointer; font-size: 14px; display: block; margin: 15px auto; }
    .divider { border-top: 2px solid #555; width: 80%; margin: 20px auto; }
    .bill-header { color: #008800; font-size: 22px; font-weight: bold; margin-bottom: 15px; }
    .bill-box { display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; }
    .bill-label { background-color: #1b8a3e; color: white; padding: 8px 25px; }
    .bill-value { color: #cc0000; padding: 8px 15px; }
  </style>
</head>
<body>

  <div class="header">CAKE SHOP</div>

  <div class="gallery">
    <div class="cake-item">
      <img src="colorcake.jpg" alt="Color Cake">
      <div>Color Cake - Rs. 350</div>
    </div>
    <div class="cake-item">
      <img src="chocolatecake.jpg" alt="Brown Cake">
      <div>Brown Cake - Rs. 300</div>
    </div>
    <div class="cake-item">
      <img src="milkycake.jpg" alt="Milky Cake">
      <div>Milky Cake - Rs. 250</div>
    </div>
    <div class="cake-item">
      <img src="bfcake.jpg" alt="Black Forest">
      <div>Black Forest Cake - Rs. 200</div>
    </div>
  </div>

  <div class="section-title">Order Cake</div>

  <div class="form-container">
    <div class="form-group">
      <label>Color Cake(Quantity)</label>
      <input type="number" id="qColor" value="2" min="0">
    </div>
    <div class="form-group">
      <label>Brown Cake(Quantity)</label>
      <input type="number" id="qBrown" value="1" min="0">
    </div>
    <div class="form-group">
      <label>Milky Cake(Quantity)</label>
      <input type="number" id="qMilky" value="2" min="0">
    </div>
    <div class="form-group">
      <label>Black Forest Cake(Quantity)</label>
      <input type="number" id="qBF" value="1" min="0">
    </div>

    <button id="btnOrder" class="btn-place">Place Order</button>
  </div>

  <div class="divider"></div>

  <div class="bill-header">Purchase Order Bill!!!</div>

  <div class="bill-box">
    <span class="bill-label">Total Price</span>
    <span class="bill-value" id="totalBill">Rs.1650</span>
  </div>

  <script>
    $(document).ready(function() {$('#btnOrder').click(function() {
        let q1 = parseInt($('#qColor').val()) || 0;
        let q2 = parseInt($('#qBrown').val()) || 0;
        let q3 = parseInt($('#qMilky').val()) || 0;
        let q4 = parseInt($('#qBF').val()) || 0;

        let total = (q1 * 350) + (q2 * 300) + (q3 * 250) + (q4 * 200);

        $('#totalBill').text('Rs.' + total);
      });
    });
  </script>
</body>
</html>
