<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Details Page</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .controls { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
    button { padding: 8px 14px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    .card { position: relative; width: 280px; padding: 15px; border: 1px solid #ccc; border-radius: 8px; background-color: #f8f9fa; box-shadow: 2px 2px 8px rgba(0,0,0,0.1); }
    .card h3 { margin-top: 0; color: #333; }
    .status { margin-top: 15px; font-weight: bold; color: green; }
  </style>
</head>
<body>

  <h2>Product Details Page</h2>

  <div class="controls">
    <button id="btnShow">Show</button>
    <button id="btnHide">Hide</button>
    <button id="btnFade">Fade</button>
    <button id="btnSlide">Slide</button>
    <button id="btnAnimate">Animate</button>
    <button id="btnStop">Stop Animation</button>
    <button id="btnCallback">Callback</button>
    <button id="btnChaining">Chaining</button>
  </div>

  <div class="card" id="productCard">
    <h3 id="pName">Laptop Pro</h3>
    <p><strong>Price:</strong> ₹65,000</p>
    <p><strong>Category:</strong> Electronics</p>
    <p><strong>Stock Status:</strong> Available</p>
  </div>

  <div class="status" id="msg"></div>

  <script>
    $(document).ready(function() {
      $('#btnShow').click(function() { $('#productCard').show(); });
      $('#btnHide').click(function() { $('#productCard').hide(); });
      $('#btnFade').click(function() { $('#productCard').fadeToggle(600); });
      $('#btnSlide').click(function() { $('#productCard').slideToggle(600); });

      $('#btnAnimate').click(function() {
        $('#productCard').animate({ left: '100px', width: '320px' }, 1000)
                         .animate({ left: '0px', width: '280px' }, 1000);
      });

      $('#btnStop').click(function() {
        $('#productCard').stop(true, true);
      });

      $('#btnCallback').click(function() {
        $('#productCard').fadeOut(800, function() {
          $('#msg').text('Animation completed successfully').fadeOut(2000, function() {
            $(this).text('').show();
          });
          $('#productCard').fadeIn(400);
        });
      });

      $('#btnChaining').click(function() {
        $('#productCard').slideUp(500).slideDown(500).fadeOut(500).fadeIn(500);
      });
    });
  </script>
</body>
</html>
