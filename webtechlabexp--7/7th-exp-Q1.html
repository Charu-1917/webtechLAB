<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Budget Calculator App</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; text-align: center; }
    .header { background-color: black; color: white; padding: 10px; font-size: 22px; font-weight: bold; }
    .container { margin-top: 20px; }
    .input-group { margin: 15px 0; }
    .inputs-inline { display: flex; justify-content: center; gap: 15px; margin: 20px 0; }
    .btn { background-color: darkblue; color: white; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 4px; }
    .results { display: flex; justify-content: center; gap: 15px; margin-top: 25px; }
    .card { width: 100px; height: 80px; color: white; padding: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: bold; border-radius: 3px; }
    .bg-blue { background-color: blue; }
    .bg-green { background-color: green; }
    .bg-cyan { background-color: #0073e6; }
    .bg-pink { background-color: #ff007f; }
  </style>
</head>
<body>

  <div class="header">Budget Calculator App</div>

  <div class="container">
    <h3>Enter Amount that you want to Manage</h3>
    <div class="input-group">
      <input type="number" id="totalAmount" value="15000">
    </div>

    <h4>How would you like to divide your money?</h4>

    <div class="inputs-inline">
      <label>Room Rent(%): <input type="number" id="rentPct" value="50" style="width: 50px;"></label>
      <label>Accessories(%): <input type="number" id="accPct" value="20" style="width: 50px;"></label>
      <label>Emergency(%): <input type="number" id="emgPct" value="20" style="width: 50px;"></label>
      <label>Saving(%): <input type="number" id="savPct" value="10" style="width: 50px;"></label>
    </div>

    <button id="btnEvaluate" class="btn">Evaluate My Money</button>

    <div class="results">
      <div class="card bg-blue">
        <span>Room Rent</span>
        <span id="rentVal">Rs. 7500</span>
      </div>
      <div class="card bg-green">
        <span>Accessories</span>
        <span id="accVal">Rs. 3000</span>
      </div>
      <div class="card bg-cyan">
        <span>Emergency</span>
        <span id="emgVal">Rs. 3000</span>
      </div>
      <div class="card bg-pink">
        <span>Saving</span>
        <span id="savVal">Rs. 1500</span>
      </div>
    </div>
  </div>

  <script>
    $(document).ready(function() {$('#btnEvaluate').click(function() {
        let amount = parseFloat($('#totalAmount').val()) || 0;
        let rent = parseFloat($('#rentPct').val()) || 0;
        let acc = parseFloat($('#accPct').val()) || 0;
        let emg = parseFloat($('#emgPct').val()) || 0;
        let sav = parseFloat($('#savPct').val()) || 0;

        let totalPct = rent + acc + emg + sav;

        if (totalPct !== 100 || amount <= 0) {
          alert('Error: The percentages must add up to exactly 100% and amount must be greater than 0.');
          return;
        }

        $('#rentVal').text('Rs. ' + (amount * (rent / 100)));
        $('#accVal').text('Rs. ' + (amount * (acc / 100)));
        $('#emgVal').text('Rs. ' + (amount * (emg / 100)));
        $('#savVal').text('Rs. ' + (amount * (sav / 100)));
      });
    });
  </script>
</body>
</html>
