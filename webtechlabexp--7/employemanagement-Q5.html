<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Management Dashboard</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .form-group { margin-bottom: 10px; }
    label { display: inline-block; width: 120px; }
    input { padding: 5px; width: 200px; }
    .btn-group { margin: 15px 0; }
    button { padding: 6px 12px; margin-right: 5px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
    .selected { background-color: #d1ecf1; font-weight: bold; }
    #statusPanel { margin-top: 15px; padding: 10px; border-radius: 4px; background-color: #e2e3e5; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Employee Management Dashboard</h2>

  <div class="form-group"><label>Employee ID:</label><input type="text" id="empId"></div>
  <div class="form-group"><label>Employee Name:</label><input type="text" id="empName"></div>
  <div class="form-group"><label>Department:</label><input type="text" id="empDept"></div>

  <div class="btn-group">
    <button id="btnAdd">Add Employee</button>
    <button id="btnUpdate">Update Employee</button>
    <button id="btnDimensions">Show Table Dimensions</button>
  </div>

  <div id="statusPanel">Ready</div>

  <table id="empTable">
    <thead>
      <tr>
        <th>Employee ID</th>
        <th>Employee Name</th>
        <th>Department</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr><td>101</td><td>Riya</td><td>HR</td><td><button class="btnDelete">Remove</button></td></tr>
      <tr><td>102</td><td>Arjun</td><td>IT</td><td><button class="btnDelete">Remove</button></td></tr>
      <tr><td>103</td><td>Meera</td><td>Finance</td><td><button class="btnDelete">Remove</button></td></tr>
    </tbody>
  </table>

  <script>
    $(document).ready(function() {
      let selectedRow = null;

      function updateStatus(text, bgColor) {
        $('#statusPanel').text(text).css('background-color', bgColor || '#e2e3e5');
      }

      $('#empTable').on('click', 'tbody tr', function(e) {
        if ($(e.target).hasClass('btnDelete')) return;
        $('#empTable tbody tr').removeClass('selected');
        $(this).addClass('selected');
        selectedRow = $(this);

        let id = $(this).children('td').eq(0).text();
        let name = $(this).children('td').eq(1).text();
        let dept = $(this).children('td').eq(2).text();

        $('#empId').val(id);
        $('#empName').val(name);
        $('#empDept').val(dept);

        updateStatus('Selected employee details loaded.', '#d4edda');
      });

      $('#btnAdd').click(function() {
        let id = $('#empId').val();
        let name = $('#empName').val();
        let dept = $('#empDept').val();

        if(!id || !name || !dept) { alert('Fill all fields'); return; }

        let newRow = `<tr><td>${id}</td><td>${name}</td><td>${dept}</td><td><button class="btnDelete">Remove</button></td></tr>`;
        $('#empTable tbody').append(newRow);
        updateStatus('New employee added successfully.', '#c3e6cb');
        $('#empId, #empName, #empDept').val('');
      });

      $('#btnUpdate').click(function() {
        if (selectedRow) {
          selectedRow.children('td').eq(0).text($('#empId').val());
          selectedRow.children('td').eq(1).text($('#empName').val());
          selectedRow.children('td').eq(2).text($('#empDept').val());
          updateStatus('Employee updated successfully.', '#ffebaba');
        }
      });

      $('#empTable').on('click', '.btnDelete', function(e) {
        e.stopPropagation();
        $(this).closest('tr').remove();
        updateStatus('Employee removed successfully.', '#f8d7da');
        $('#empId, #empName, #empDept').val('');
        selectedRow = null;
      });

      $('#btnDimensions').click(function() {
        let w = $('#empTable').width();
        let h = $('#empTable').height();
        updateStatus(`Table Width: ${w}px, Height: ${h}px`, '#d1ecf1');
      });
    });
  </script>
</body>
</html>
