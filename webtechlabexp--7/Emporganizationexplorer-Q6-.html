<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Organization Explorer</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .project, .team, .employee { border: 1px solid #aaa; margin: 8px; padding: 8px; border-radius: 4px; }
    .project { background-color: #f0f4f8; }
    .team { background-color: #ffffff; }
    .employee { background-color: #f9f9f9; display: inline-block; cursor: pointer; }
    .highlight { background-color: #ffe066 !important; border-color: #cc9900; }
    .btn-group { margin-bottom: 15px; display: flex; gap: 8px; flex-wrap: wrap; }
    button { padding: 6px 12px; cursor: pointer; }
    .info { margin-top: 15px; padding: 10px; background-color: #e9ecef; border-radius: 4px; }
  </style>
</head>
<body>

  <h2>Employee Organization Explorer</h2>

  <div class="btn-group">
    <button id="btnParent">Show Parent Team</button>
    <button id="btnAncestors">Show All Ancestors</button>
    <button id="btnDescendants">Show Project Employees</button>
    <button id="btnSiblings">Show Teammates</button>
    <button id="btnSenior">Show Senior Employees</button>
    <button id="btnReset">Reset</button>
  </div>

  <div class="project" id="projectAlpha">
    <h3>Project Alpha</h3>

    <div class="team" id="devTeam">
      <h4>Development Team</h4>
      <div class="employee" data-role="Developer">Arun</div>
      <div class="employee senior" data-role="Senior Developer">Kavya</div>
      <div class="employee" data-role="Developer">Rahul</div>
    </div>

    <div class="team" id="testTeam">
      <h4>Testing Team</h4>
      <div class="employee" data-role="Tester">Meena</div>
      <div class="employee senior" data-role="Senior Tester">Priya</div>
      <div class="employee" data-role="Tester">Karthik</div>
    </div>
  </div>

  <div class="info" id="infoBox">Click an employee to select them.</div>

  <script>
    $(document).ready(function() {
      let $selectedEmp = null;

      function clearHighlights() {
        $('*').removeClass('highlight');
      }

      $('.employee').click(function() {
        clearHighlights();
        $selectedEmp = $(this);$selectedEmp.addClass('highlight');

        let name = $selectedEmp.text();
        let team = $selectedEmp.parent().find('h4').text();
        let project = $selectedEmp.closest('.project').find('h3').text();
        let teammates = $selectedEmp.siblings('.employee').map(function() { return$(this).text(); }).get().join(', ');

        $('#infoBox').html(`<strong>Selected Employee:</strong> ${name}<br>` +
                           `<strong>Parent Team:</strong> ${team}<br>` +
                           `<strong>Project:</strong> ${project}<br>` +
                           `<strong>Teammates:</strong> ${teammates}`);
      });

      $('#btnParent').click(function() {
        if ($selectedEmp) {
          clearHighlights();
          $selectedEmp.addClass('highlight');$selectedEmp.parent('.team').addClass('highlight');
        }
      });

      $('#btnAncestors').click(function() {
        if ($selectedEmp) {
          clearHighlights();
          $selectedEmp.addClass('highlight');$selectedEmp.parents('.team, .project').addClass('highlight');
        }
      });

      $('#btnDescendants').click(function() {
        clearHighlights();
        $('#projectAlpha').find('.team, .employee').addClass('highlight');
      });

      $('#btnSiblings').click(function() {
        if ($selectedEmp) {
          clearHighlights();
          $selectedEmp.addClass('highlight');$selectedEmp.siblings('.employee').addClass('highlight');
        }
      });

      $('#btnSenior').click(function() {
        clearHighlights();
        $('.employee').filter('.senior').addClass('highlight');
        let seniors = $('.employee').filter('.senior').map(function() { return $(this).text(); }).get().join(', ');$('#infoBox').html(`<strong>Senior Employees:</strong> ${seniors}`);
      });

      $('#btnReset').click(function() {
        clearHighlights();
        $selectedEmp = null;
        $('#infoBox').text('Click an employee to select them.');
      });
    });
  </script>
</body>
</html>
