<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Car Workshop</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; }
    h2 { color: #0073e6; margin-top: 20px; }
    .car-container { position: relative; width: 300px; height: 180px; margin: 40px auto; }
    .roof { position: absolute; top: 0; left: 80px; width: 140px; height: 50px; background-color: #76c043; border-radius: 10px 10px 0 0; }
    .glass { position: absolute; top: 10px; left: 100px; width: 100px; height: 35px; background-color: #87ceeb; border-radius: 5px 5px 0 0; opacity: 0.8; }
    .body { position: absolute; top: 50px; left: 30px; width: 240px; height: 60px; background-color: #76c043; border-radius: 5px; }
    .wheel { position: absolute; top: 90px; width: 60px; height: 60px; background-color: #0f1c4d; border-radius: 50%; transition: all 0.3s; }
    .wheel-left { left: 50px; }
    .wheel-right { left: 190px; }
    .btn-group { display: flex; justify-content: center; gap: 15px; margin-top: 30px; }
    .btn { background-color: white; border: 1px solid #0073e6; color: #0073e6; padding: 6px 14px; border-radius: 4px; cursor: pointer; }
    .btn:hover { background-color: #f0f8ff; }
  </style>
</head>
<body>

  <h2>3. Car Workshop</h2>

  <div class="car-container">
    <div class="roof car-color"></div>
    <div class="glass" id="carGlass"></div>
    <div class="body car-color"></div>
    <div class="wheel wheel-left" id="wheel1"></div>
    <div class="wheel wheel-right" id="wheel2"></div>
  </div>

  <div class="btn-group">
    <button class="btn" id="btnColor">Change Stem Color</button>
    <button class="btn" id="btnRoof">Change Roof Color</button>
    <button class="btn" id="btnTyreInc">Tyre Size Increase</button>
    <button class="btn" id="btnTyreDec">Tyre Size Decrease</button>
    <button class="btn" id="btnReset">Reset</button>
  </div>

  <script>
    $(document).ready(function() {
      const colors = ['#76c043', '#e63946', '#ffb703', '#8e44ad', '#34495e'];
      let colorIndex = 0;
      let currentTyreSize = 60;

      $('#btnColor').click(function() {
        colorIndex = (colorIndex + 1) % colors.length;
        $('.car-color').css('background-color', colors[colorIndex]);
      });

      $('#btnRoof').click(function() {
        $('#carGlass').css('background-color', $('#carGlass').css('background-color') === 'rgb(135, 206, 235)' ? '#333' : '#87ceeb');
      });

      $('#btnTyreInc').click(function() {
        if (currentTyreSize < 90) {
          currentTyreSize += 5;
          $('.wheel').css({ width: currentTyreSize + 'px', height: currentTyreSize + 'px' });
        }
      });

      $('#btnTyreDec').click(function() {
        if (currentTyreSize > 40) {
          currentTyreSize -= 5;
          $('.wheel').css({ width: currentTyreSize + 'px', height: currentTyreSize + 'px' });
        }
      });

      $('#btnReset').click(function() {
        colorIndex = 0;
        currentTyreSize = 60;
        $('.car-color').css('background-color', '#76c043');
        $('#carGlass').css('background-color', '#87ceeb');
        $('.wheel').css({ width: '60px', height: '60px' });
      });
    });
  </script>
</body>
</html>
